[package]
name = "picell3d"
version = "0.1.0"
description = "A pixel art editor that generates 3D voxel models"
authors = ["Picell3D"]
edition = "2021"

[lib]
name = "picell3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
